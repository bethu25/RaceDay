```yaml
# Name displayed in the GitHub Actions tab.
name: RaceDay CI/CD

# Run the workflow when code is pushed or a pull request targets main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    # Use an Ubuntu virtual machine hosted by GitHub.
    runs-on: ubuntu-latest

    steps:
      # Download the repository files.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the .NET 8 SDK.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore the NuGet packages required by the solution.
      - name: Restore dependencies
        run: dotnet restore

      # Compile the solution in Release configuration.
      - name: Build project
        run: dotnet build --no-restore --configuration Release

      # Run the unit tests in the solution.
      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal
```
